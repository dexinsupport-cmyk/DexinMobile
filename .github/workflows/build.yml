name: Build Dexin Mobile APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    name: Build Dexin Mobile
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reassemble split source ZIP
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          mapfile -t PARTS < <(
            find . -maxdepth 2 -type f -name '*.zip' -print |
            awk '
              match($0,/Part[0-9]+(-[^\/]*)?\.zip$/) {
                s=substr($0,RSTART,RLENGTH)
                n=s; sub(/^Part/,"",n); sub(/-.*/,"",n); sub(/\.zip$/,"",n)
                print n "\t" $0
              }
            ' | sort -n -k1,1 | cut -f2-
          )

          if [ "${#PARTS[@]}" -eq 0 ]; then
            echo "ERROR: No Part*.zip files were found."
            echo "Expected names such as sampstable_DexinMobile_fixedPart1.zip, Part2.zip, ..."
            exit 1
          fi

          expected=1
          for part in "${PARTS[@]}"; do
            base="$(basename "$part")"
            num="$(printf '%s' "$base" | sed -E 's/.*Part([0-9]+)(-[^/]*)?\.zip$/\1/')"
            if [ "$num" != "$expected" ]; then
              echo "ERROR: Expected Part${expected}, found Part${num}: $base"
              exit 1
            fi
            expected=$((expected + 1))
          done

          echo "Found ${#PARTS[@]} parts:"
          printf '  %s\n' "${PARTS[@]}"

          rm -f source.zip
          cat "${PARTS[@]}" > source.zip
          echo "Combined source size: $(du -h source.zip | cut -f1)"
          unzip -t source.zip

          rm -rf _source
          mkdir _source
          unzip -q source.zip -d _source

      - name: Locate Android Gradle project
        shell: bash
        run: |
          set -euo pipefail
          GRADLEW="$(find _source -type f -name gradlew -print -quit)"
          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew was not found after extracting source.zip"
            find _source -maxdepth 4 -type f | head -100
            exit 1
          fi
          PROJECT_DIR="$(dirname "$GRADLEW")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Gradle project: $PROJECT_DIR"

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-30" "build-tools;30.0.1"

      - name: Prepare Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          test -f settings.gradle || test -f settings.gradle.kts
          test -f build.gradle || test -f build.gradle.kts
          test -d app

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace assembleDebug 2>&1 | tee "$GITHUB_WORKSPACE/gradle-build.log"

      - name: List APK output
        if: always()
        run: find "$PROJECT_DIR/app/build/outputs/apk" -type f -name '*.apk' -print 2>/dev/null || true

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: DexinMobile-build-log
          path: gradle-build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DexinMobile-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
