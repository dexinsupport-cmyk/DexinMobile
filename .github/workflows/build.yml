name: Build Dexin Mobile APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build Dexin Mobile
    runs-on: ubuntu-22.04

    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Extract project zip
        run: |
          ZIPFILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -z "$ZIPFILE" ]; then
            echo "ERROR: no zip file found in repo root"
            exit 1
          fi
          echo "Extracting $ZIPFILE"
          mkdir -p _extracted_tmp
          unzip -o "$ZIPFILE" -d _extracted_tmp

          # If settings.gradle is not at the top level, find it and flatten
          if [ -f "_extracted_tmp/settings.gradle" ]; then
            SRC_DIR="_extracted_tmp"
          else
            SRC_DIR=$(find _extracted_tmp -maxdepth 3 -name "settings.gradle" -exec dirname {} \; | head -n 1)
          fi

          if [ -z "$SRC_DIR" ]; then
            echo "ERROR: settings.gradle not found anywhere inside the zip"
            find _extracted_tmp -maxdepth 3 -type d
            exit 1
          fi

          echo "Project root found at: $SRC_DIR"
          shopt -s dotglob
          cp -r "$SRC_DIR"/* .
          rm -rf _extracted_tmp

      - name: Setup Java 17 (for Android SDK manager)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/tools/bin" >> "$GITHUB_PATH"
          if [ ! -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            find "$ANDROID_SDK_ROOT" -type f -name sdkmanager -print | head -20
          fi

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER=""
          for p in \
            "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "$ANDROID_SDK_ROOT/cmdline-tools/bin/sdkmanager" \
            "$ANDROID_SDK_ROOT/tools/bin/sdkmanager"; do
            if [ -x "$p" ]; then SDKMANAGER="$p"; break; fi
          done
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_SDK_ROOT" -type f -name sdkmanager -print -quit || true)"
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager was not found"
            exit 1
          fi
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-30" "build-tools;30.0.1"

      - name: Setup Java 8 (for Gradle build)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'

      - name: Verify project structure
        run: |
          test -f settings.gradle
          test -f build.gradle
          test -f gradlew
          test -d app
          echo "Project root is correct."

      - name: Fix line endings
        run: sed -i 's/\r$//' gradlew

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew --no-daemon assembleDebug --stacktrace

      - name: Show APK
        run: find app/build/outputs/apk -type f -name '*.apk' -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DexinMobile-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
